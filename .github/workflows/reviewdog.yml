name: Reviewdog Static Analysis & Automated Triage

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: reviewdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewdog-analysis:
    name: TypeScript Reviewdog Analysis & Defect Triage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository Head Branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Pre-Analysis Automated Conflict Resolution (Isolated Commit)
        id: conflict-resolution
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Fetching target base branch origin/${BASE_REF}..."
          git fetch origin "${BASE_REF}"

          # Test if merging base branch causes merge conflicts
          if ! git merge-tree $(git merge-base HEAD "origin/${BASE_REF}") HEAD "origin/${BASE_REF}" | grep -q "<<<<<<<"; then
            echo "No merge conflicts detected with origin/${BASE_REF}."
            echo "conflict_resolved=false" >> $GITHUB_OUTPUT
          else
            echo "Merge conflicts detected. Resolving against origin/${BASE_REF}..."
            git merge "origin/${BASE_REF}" --no-commit --allow-unrelated-histories || true

            # Automatically resolve conflict markers taking base branch changes where appropriate
            git status --porcelain | grep "^UU" | cut -c4- | while read -r file; do
              git checkout --theirs "$file" || true
              git add "$file"
            done

            if [ -f "package.json" ]; then
              npm install --package-lock-only || true
              git add package-lock.json || true
            fi

            git commit -m "chore(pr): resolve merge conflicts with ${BASE_REF}"
            git push origin "HEAD:${HEAD_REF}"
            echo "conflict_resolved=true" >> $GITHUB_OUTPUT
            echo "Successfully resolved merge conflicts in a dedicated isolated commit."
          fi

      - name: Execute TypeScript Analysis & Reviewdog
        uses: reviewdog/action-tsc@v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: error
          fail_on_error: true
          tsc_flags: "--noEmit"

      - name: Capture Raw TypeScript Diagnostic Output
        run: |
          npx tsc --noEmit > tsc_output.log 2>&1 || true
          cat tsc_output.log

      - name: Post-Review Inspection, Prioritization & Zero-Duplication Triage
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CONFLICT_RESOLVED: ${{ steps.conflict-resolution.outputs.conflict_resolved }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/reviewdog_triage.js

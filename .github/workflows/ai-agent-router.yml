name: AI Agent Router & Autonomous Execution

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  agent-router:
    name: Route AI Agent Execution
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]' &&
      (
        contains(github.event.issue.labels.*.name, 'ai-fix') ||
        contains(github.event.pull_request.labels.*.name, 'ai-fix') ||
        contains(github.event.pull_request.labels.*.name, 'resolve-conflicts') ||
        contains(github.event.pull_request.labels.*.name, 'autorebase')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Consume Triggering Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ] && [ -n "${{ github.event.issue.number }}" ]; then
            gh issue edit "${{ github.event.issue.number }}" --remove-label "ai-fix" || true
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "ai-fix" || true
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "resolve-conflicts" || true
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "autorebase" || true
          fi

      - name: Invoke Google Jules AI Agent
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Execute autonomous task routing in accordance with AGENTS.md:
            1. Adhere to product invariants: BIPA consent, local-only egress guard, memory sanitization, and WebGPU sub-16 ms rendering.
            2. Run local verification suite (npm ci, npm run lint, npm run test:unit, npm run test:audit).
            3. Open or update pull requests targeting main.

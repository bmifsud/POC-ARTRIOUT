name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-assurance:
    name: Validate BIPA Compliance & Performance
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js Environment
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps

      - name: Execute Unit Tests (Matrix Transformations)
        run: npm run test:unit --if-present

      - name: Execute Playwright BDD User Flows
        run: npm test

      - name: Run Automated Zero-Egress Network Audit
        run: npm run test:audit
        env:
          CI: true

      - name: Upload Test Coverage
        uses: codecov/codecov-action@eaaf4bed92b4320db9594be4120cfd4f23e2003c # v3.1.4
        if: always()

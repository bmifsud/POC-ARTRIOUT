name: PR Automation

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conflict-check:
    name: Check Merge Conflicts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Label Merge Conflicts
        uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: "has conflicts"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"

  auto-label:
    name: Auto Label PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Label based on files changed
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

  review-pr:
    name: Jules Automated PR Review
    if: >
      github.event_name == 'pull_request_target' &&
      github.actor != 'google-labs-jules[bot]' &&
      github.actor != 'google-labs-jules' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Invoke Jules Automated PR Reviewer
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are acting as the automated code review agent for PR #${{ github.event.pull_request.number }}: "${{ github.event.pull_request.title }}".

            Automated QA Gating Constraints:
            - You MUST explicitly verify >=80% code coverage (evaluated via `c8` output or similar mechanisms) before approving any Pull Request.
            - You MUST explicitly verify zero-egress network audit compliance (evaluated via `npm run test:audit` / `NetworkEgressGuard`) before approving any Pull Request.
            - If either of these QA gates fail, you MUST request changes and clearly document the failing metrics in your review.

            Review Directives & Architectural Constraints:
            1. Evaluate all changes against strict project baselines defined in AR trion:
               - Zero-Egress Network Compliance: Ensure no camera frame data or biometric landmarks are transmitted off-device (`NetworkEgressGuard.ts`).
               - BIPA Ephemeral Memory Sanitization: Ensure `MemorySanitizer.ts` or `sanitizeFrame` is called to purge frame buffers and biometric arrays immediately after processing.
               - WebGPU Rendering Performance: Enforce native WebGPU pipeline execution with a sub-16 ms (60 FPS) rendering frame budget; strictly reject WebGL fallback contexts.
               - Multi-Agent Orchestration & System Models: Verify orchestration endpoints, model configuration, persona configuration, and agent execution flow to ensure local-only model routing.
            2. Limit Pull Request code review feedback and comments strictly to addressing CRITICAL and HIGH severity issues/findings.
            3. If a critical or high severity architectural constraint, privacy rule, or performance metric is violated, automatically request changes or reject the PR with explicit detailed rationale.
            4. Do NOT block or comment on the PR for medium and low severity feedback. Instead, automatically log all medium and low severity feedback as GitHub project issues for later review:
               - For each medium or low severity issue/bug detected, use the GitHub API or CLI (`gh issue create`) to create a new issue.
               - Title format: "[<SeverityLevel>] Bug: <Brief Summary> (PR #${{ github.event.pull_request.number }})"
               - Body: Provide a clear description of the finding, location in code, impact, severity justification (Medium or Low), and steps/recommendations for remediation.
               - Labels: Apply appropriate labels such as `bug` and severity labels (e.g. `severity: medium`, `severity: low`).

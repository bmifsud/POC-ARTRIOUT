name: Auto Rebase Open Pull Requests

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  autorebase:
    name: Rebase Open Pull Requests
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase Open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all remote branches
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          # Get open pull requests targeting main
          prs=$(gh pr list --base main --state open --json number,headRefName,isCrossRepository --jq '.[]')

          if [ -z "$prs" ]; then
            echo "No open pull requests targeting main found."
          else
            echo "$prs" | jq -c '.' | while read -r pr; do
              pr_number=$(echo "$pr" | jq -r '.number')
              branch=$(echo "$pr" | jq -r '.headRefName')
              is_fork=$(echo "$pr" | jq -r '.isCrossRepository')

              echo "=============================================="
              echo "Processing PR #${pr_number} (Branch: ${branch})"

              if [ "$is_fork" = "true" ]; then
                echo "Skipping PR #${pr_number} because it comes from a fork."
                continue
              fi

              if [ "$branch" = "main" ]; then
                echo "Skipping main branch."
                continue
              fi

              # Clean workspace prior to branch checkout
              git reset --hard
              git clean -fd

              if ! git checkout -B "$branch" "origin/$branch"; then
                echo "::warning title=Checkout Failed::Failed to checkout branch $branch for PR #${pr_number}"
                continue
              fi

              if git rebase origin/main; then
                echo "Rebase succeeded for PR #${pr_number} (${branch}). Pushing with force-with-lease..."
                if git push --force-with-lease origin "$branch"; then
                  echo "Successfully pushed rebased branch $branch for PR #${pr_number}."
                else
                  echo "::warning title=Push Failed::Failed to push $branch with force-with-lease for PR #${pr_number}."
                fi
              else
                echo "::warning title=Rebase Conflict::Merge conflicts encountered when rebasing PR #${pr_number} (${branch}) on origin/main. Aborting rebase."
                git rebase --abort || true
                git reset --hard
                git clean -fd
              fi
            done
          fi

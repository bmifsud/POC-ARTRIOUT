name: Jules Autonomous Bug Fixer

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix-bug:
    name: Fix Reported Bug
    if: >
      github.actor != 'google-labs-jules[bot]' &&
      github.actor != 'google-labs-jules' &&
      github.actor != 'github-actions[bot]' &&
      ((github.event.action == 'opened' && (contains(github.event.issue.labels.*.name, 'bug') || contains(github.event.issue.labels.*.name, 'auto-fix'))) ||
       (github.event.action == 'labeled' && (github.event.label.name == 'bug' || github.event.label.name == 'auto-fix' || github.event.label.name == 'jules:fix')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Invoke Jules Autonomous Bug Fixer
        uses: google-labs-code/jules-action@v1.0.0
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            An issue labeled for autonomous remediation has been reported in Issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".

            Issue Description:
            ${{ github.event.issue.body }}

            Execution Directives:
            1. Clone the repository in the isolated cloud sandbox and reproduce the issue using or creating targeted test cases.
            2. Identify the root cause within the codebase and implement a targeted code fix adhering strictly to BIPA consent hard gates, zero-retention memory sanitization (`MemorySanitizer.ts`), zero-egress network policies (`NetworkEgressGuard.ts`), and sub-16 ms WebGPU rendering frame budgets.
            3. Before submitting the remediation PR, locally execute the full CI sequence (`npm ci`, `npm run lint`, `npm run test:unit`, `npm run test:audit`) to guarantee zero performance or biometric regressions.
            4. Submit a targeted pull request referencing Issue #${{ github.event.issue.number }} and citing AR trion as the authoritative architectural baseline.

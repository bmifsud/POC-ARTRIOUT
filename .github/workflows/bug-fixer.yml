name: Jules Bug Fixer

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix-bug:
    name: Fix Reported Bug
    if: >
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'bug')) ||
      (github.event.action == 'labeled' && (github.event.label.name == 'bug' || github.event.label.name == 'jules:fix'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Invoke Jules Bug Fixer
        uses: google-github-actions/jules-action@v1
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            A bug has been reported in issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".

            Issue Description:
            ${{ github.event.issue.body }}

            Tasks:
            1. Reproduce the bug by creating or inspecting relevant tests.
            2. Identify the root cause in the codebase.
            3. Implement the fix while maintaining strict BIPA compliance and zero-egress network policies.
            4. Verify that all linting, unit tests, and audit tests pass cleanly.
            5. Submit a pull request addressing issue #${{ github.event.issue.number }}.

name: Jules Auto Conflict Resolver

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-conflicts:
    name: Automatically Resolve Conflicts
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]' &&
      (
        contains(github.event.pull_request.labels.*.name, 'resolve-conflicts') ||
        contains(github.event.pull_request.labels.*.name, 'ai-fix')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Consume Label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --remove-label "resolve-conflicts" || true

      - name: Invoke Jules Conflict Resolver
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Pull Request #${{ github.event.pull_request.number }}: "${{ github.event.pull_request.title }}" (from repository '${{ github.event.pull_request.head.repo.full_name }}', branch '${{ github.event.pull_request.head.ref }}') has merge conflicts with base branch '${{ github.event.pull_request.base.ref }}'.

            Remediation Tasks:
            1. Fetch target branch '${{ github.event.pull_request.base.ref }}' and merge or rebase into branch '${{ github.event.pull_request.head.ref }}'.
            2. Resolve all merge conflicts accurately.
            3. Verify that all standard project checks (`npm run lint`, `npm run test:unit`, `npm run test:audit`) pass cleanly after resolving conflicts.
            4. Push the conflict-resolved branch back to the pull request.

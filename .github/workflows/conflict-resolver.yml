name: Jules Auto Conflict Resolver

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-conflicts:
    name: Automatically Resolve Conflicts
    if: >
      github.actor != 'google-labs-jules[bot]' &&
      github.actor != 'google-labs-jules' &&
      (
        contains(github.event.pull_request.labels.*.name, 'has conflicts') ||
        contains(github.event.pull_request.labels.*.name, 'has-conflicts') ||
        contains(github.event.pull_request.labels.*.name, 'conflicts') ||
        contains(github.event.pull_request.labels.*.name, 'conflict') ||
        contains(github.event.pull_request.labels.*.name, 'resolve-conflicts') ||
        contains(github.event.pull_request.labels.*.name, 'has_conflicts') ||
        github.event.label.name == 'has conflicts' ||
        github.event.label.name == 'has-conflicts' ||
        github.event.label.name == 'conflicts' ||
        github.event.label.name == 'conflict' ||
        github.event.label.name == 'resolve-conflicts' ||
        github.event.label.name == 'has_conflicts'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Invoke Jules Conflict Resolver
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Pull Request #${{ github.event.pull_request.number }}: "${{ github.event.pull_request.title }}" has merge conflicts with base branch '${{ github.event.pull_request.base.ref }}'.

            Remediation Tasks:
            1. Fetch target branch '${{ github.event.pull_request.base.ref }}' and merge or rebase into branch '${{ github.event.pull_request.head.ref }}'.
            2. Resolve all merge conflicts accurately.
            3. Verify that all standard project checks (`npm run lint`, `npm run test:unit`, `npm run test:audit`) pass cleanly after resolving conflicts.
            4. Push the conflict-resolved branch back to the pull request.

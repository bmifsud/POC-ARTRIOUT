name: Jules Weekly Cleanup

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-maintenance:
    name: Codebase Cleanup and Maintenance
    if: >
      github.actor != 'google-labs-jules[bot]' &&
      github.actor != 'google-labs-jules' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Invoke Jules Weekly Cleanup
        uses: google-labs-code/jules-action@v1
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Perform routine weekly codebase maintenance and cleanup.

            Tasks:
            1. Scan for dead or unused code, redundant imports, and formatting inconsistencies.
            2. Verify dependency health and lockfile consistency.
            3. Ensure BIPA compliance guards, zero-egress network policies, and memory sanitization logic remain intact per AR trion baselines.
            4. Execute tests and linters to verify zero regressions.
            5. Submit a pull request titled 'chore(maintenance): weekly automated code cleanup'.

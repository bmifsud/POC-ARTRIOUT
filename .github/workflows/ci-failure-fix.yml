name: Jules CI Failure Fixer

on:
  workflow_run:
    workflows: ["Continuous Integration", "Continuous Integration and Delivery"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  auto-remediate:
    name: Auto Remediate CI Failure
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login != 'google-labs-jules[bot]' &&
      github.event.workflow_run.actor.login != 'google-labs-jules' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Invoke Jules Auto-Remediation
        uses: google-labs-code/jules-action@v1
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The Continuous Integration workflow failed on branch '${{ github.event.workflow_run.head_branch }}'.

            Remediation Tasks:
            1. Analyze the failing commit and identify unit test, compilation, or lint failures.
            2. Re-run tests in the cloud VM to verify the failure.
            3. Apply the minimal necessary patch to resolve the issue while preserving BIPA compliance and zero-egress policies as specified in AR trion.
            4. Verify that all linters and tests pass cleanly in the VM.
            5. Submit a pull request targeting '${{ github.event.workflow_run.head_branch }}' titled 'fix(ci): automated remediation of build failure'.

name: Jules Consolidated Workflow

on:
  issues:
    types: [opened, labeled, edited, unlabeled]
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited, unlabeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write
  id-token: write
  actions: read

concurrency:
  group: pr-agent-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci-validation-bipa:
    name: CI, Validation & BIPA Gate
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: |
          npx playwright install
          npx playwright install-deps

      - name: Run Static Code Analysis & Lint
        run: npm run lint

      - name: Execute BIPA Compliance & Ephemeral Memory Gate
        env:
          MOCK_WASM_FOR_TESTS: 'true'
          CI: 'true'
        run: npm run test:unit -- tests/unit/clickwrap-consent.spec.ts tests/unit/compliance.test.ts tests/unit/memory-sanitizer.spec.ts

      - name: Execute Zero-Egress Network Audit
        env:
          MOCK_WASM_FOR_TESTS: 'true'
          CI: 'true'
        run: npm run test:audit

      - name: Build Production Assets
        run: npm run build

  playwright-matrix:
    name: Playwright Matrix Testing (${{ matrix.project }})
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, iphone, android-tablet]

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        with:
          scan-args: '--format=sarif --output=osv-results.sarif .'
        continue-on-error: true

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        continue-on-error: true

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog-main-action@main
        with:
          extra_args: --debug --only-verified
        continue-on-error: true

      - name: Run OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      - name: Label Issue 184 with Automation
      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: |
          npx playwright install
          npx playwright install-deps

      - name: Run Playwright Tests (${{ matrix.project }})
        env:
          MOCK_WASM_FOR_TESTS: 'true'
          CI: 'true'
        run: npx playwright test --project=${{ matrix.project }}

  reviewdog-triage:
    name: Reviewdog Static Analysis & Triage
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Static Analysis & Save Log
        run: npx tsc --noEmit > tsc_output.log 2>&1 || true

      - name: Execute Reviewdog Zero-Duplication Triage
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reviewdog_triage.js

  rebase-logic:
    name: Autorebase & Conflict Resolution
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and Rebase PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'autorebase') || contains(github.event.pull_request.labels.*.name, 'resolve-conflicts') || contains(github.event.pull_request.labels.*.name, 'ai-fix') }}" = "true" ]; then
            echo "Rebase / conflict resolution requested for PR #${PR_NUMBER}."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase conflict detected, attempting merge fallback..."
              git rebase --abort || true
              git merge origin/main -m "chore(rebase): sync branch with origin/main" --allow-unrelated-histories || true
            }
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}" --force-with-lease || echo "Push skipped"
          fi

      - name: Consume Rebase Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "autorebase" || true
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "resolve-conflicts" || true
          fi

  jules-governance:
    name: Execute Jules Governance Plan
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write
      pull-requests: write
      security-events: write
      id-token: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Static Analysis & Save Log
        run: npx tsc --noEmit > tsc_output.log 2>&1 || true

      - name: Execute Reviewdog Zero-Duplication Triage
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reviewdog_triage.js

  rebase-logic:
    name: Autorebase & Conflict Resolution
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and Rebase PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'autorebase') || contains(github.event.pull_request.labels.*.name, 'resolve-conflicts') || contains(github.event.pull_request.labels.*.name, 'ai-fix') }}" = "true" ]; then
            echo "Rebase / conflict resolution requested for PR #${PR_NUMBER}."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase conflict detected, attempting merge fallback..."
              git rebase --abort || true
              git merge origin/main -m "chore(rebase): sync branch with origin/main" --allow-unrelated-histories || true
            }
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}" --force-with-lease || echo "Push skipped"
          fi

      - name: Consume Rebase Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "autorebase" || true
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "resolve-conflicts" || true
          fi

  jules-governance:
    name: Execute Jules Governance Plan
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Consume Triggering Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue edit "${{ github.event.issue.number }}" --remove-label "ai-fix" || true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "ai-fix" || true
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "resolve-conflicts" || true
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "autorebase" || true
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f09c1c061042a2215462d733cb030a59966d5b0d # v3.28.10
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f09c1c061042a2215462d733cb030a59966d5b0d # v3.28.10

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@52e259b10167c1e549eb403758b730f9a26be465 # v1.9.2
        with:
          scan-args: |-
            --recursive
            ./

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@304856a908a8e10c73295b9ec8eb873f47e30ca0 # v3.88.15
        with:
          extra_args: --debug --only-verified

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@f49aabe0b5af0936a09f2f27027d14c330f6575c # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Invoke Google Jules Action
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Implement the Workflow Consolidation & Governance Plan detailed in Issue #184:
            1. Establish core config and process issue or pull request event triggers through this single consolidated workflow pipeline.
            2. Maintain workspace immutability using non-persistent credentials (`persist-credentials: false`) and SHA-pinned actions.
            3. Enforce least-privilege token access by setting read-only workflow permissions and elevating permissions strictly at job level.
            4. Enforce 15-minute alert grouping and execution windows (`timeout-minutes: 15`).
            5. Integrate CodeQL, OSV Scanner, Dependency Review, TruffleHog OSS, and OpenSSF Scorecard into the consolidated workflow pipeline.
            6. Adhere strictly to AR trion baseline requirements: zero-egress network compliance (`NetworkEgressGuard.ts`), BIPA ephemeral memory sanitization (`MemorySanitizer.ts`), and sub-16 ms WebGPU rendering budgets.
            7. Before submitting changes, execute local verification (`npm ci`, `npm run lint`, `npm run test:unit`, `npm run test:audit`).
            8. Create or update targeted pull requests referencing Issue #184.

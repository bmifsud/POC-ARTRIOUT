name: Jules Consolidated Workflow

on:
  issues:
    types: [opened, labeled, edited, unlabeled]
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited, unlabeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  jules-governance:
    name: Execute Jules Governance Plan
    if: >
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Label Issue 184 with Automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit 184 --add-label "Automation" || true

      - name: Consume Triggering Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue edit "${{ github.event.issue.number }}" --remove-label "ai-fix" || true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "ai-fix" || true
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "resolve-conflicts" || true
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "autorebase" || true
          fi

      - name: Invoke Google Jules Action
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Ensure that Issue #184 is labeled with 'Automation'.

            Implement the Workflow Consolidation & Governance Plan detailed in Issue #184:
            1. Process issue or pull request event triggers through this single consolidated workflow pipeline.
            2. Adhere strictly to AR trion baseline requirements: zero-egress network compliance (`NetworkEgressGuard.ts`), BIPA ephemeral memory sanitization (`MemorySanitizer.ts`), and sub-16 ms WebGPU rendering budgets.
            3. Before submitting changes, execute local verification (`npm ci`, `npm run lint`, `npm run test:unit`, `npm run test:audit`).
            4. Create or update targeted pull requests referencing Issue #184.

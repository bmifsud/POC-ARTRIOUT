name: Reactive Issue Triage & Diagnostic Enrichment

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  triage-issue:
    name: Enrich Issue & Analyze Context
    if: >
      github.actor != 'google-labs-jules[bot]' &&
      github.actor != 'google-labs-jules' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Invoke Jules Issue Triager
        uses: google-labs-code/jules-action@v1.0.0
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are acting as the Principal AI DevOps Engineer triaging Issue #${{ github.event.issue.number }}: "${{ github.event.issue.title }}".

            Issue Body:
            ${{ github.event.issue.body }}

            Directives:
            1. Analyze the reported issue and enrich it with necessary diagnostic context and recommended triage labels (e.g. `bug`, `auto-fix`, `compliance`, `performance`).
            2. Cross-reference the reported anomaly with the distributed web architecture principles and multi-agent orchestrations detailed in AR trion (BIPA memory zeroing, zero-egress network policies, sub-16 ms WebGPU rendering budgets).
            3. Post an informative diagnostic summary comment on the issue.

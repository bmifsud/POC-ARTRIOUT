name: Jules Performance Improver

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  optimize-performance:
    name: Optimize Performance Bottleneck
    if: >
      github.event.label.name == 'performance' ||
      github.event.label.name == 'jules:opt'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Invoke Jules Performance Optimizer
        uses: google-github-actions/jules-action@v1
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            A performance optimization task has been flagged for item #${{ github.event.issue.number || github.event.pull_request.number }}: "${{ github.event.issue.title || github.event.pull_request.title }}".

            Details:
            ${{ github.event.issue.body || github.event.pull_request.body }}

            Tasks:
            1. Analyze flagged performance bottlenecks (e.g. WebGPU pipeline efficiency, memory allocation, matrix operations, or ML inference runtime).
            2. Implement non-breaking optimizations while strictly adhering to BIPA zero-retention compliance and zero-egress policies.
            3. Benchmark and verify that unit tests, Playwright tests, and zero-egress audits pass cleanly.
            4. Submit a pull request or commit updates detailing performance gains.

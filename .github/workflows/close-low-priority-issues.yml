name: Jules Scan, Review & Resolve All Open Issues

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan-and-resolve-issues:
    name: Scan, Review & Resolve All Open Project Issues
    if: >
      github.actor != 'google-labs-jules[bot]' &&
      github.actor != 'google-labs-jules' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Invoke Jules Issue Resolver
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Automatically scan, review, and resolve all open project issues across the repository.

            Tasks:
            1. Query all open issues in the repository regardless of priority or labels.
            2. Review each issue's contents, requirements, diagnostic context, and current repository codebase status.
            3. For each open issue:
               a. Verify whether the problem is already addressed, obsolete, or redundant.
               b. If code remediation is required, implement the necessary changes, features, or fixes in compliance with AR trion baselines (BIPA clickwrap consent, zero-retention memory sanitization, zero-egress network policies, sub-16 ms WebGPU rendering frame budget).
               c. Verify locally in the cloud VM that all unit tests, linters, and audit suites pass cleanly.
               d. Post a detailed summary review comment on the issue explaining the findings or resolution status.
               e. Submit a pull request referencing the open issue, or automatically close off resolved, obsolete, or completed issues.

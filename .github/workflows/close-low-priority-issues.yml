name: Jules Auto-Close Low/Medium Priority Issues

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-and-close-issues:
    name: Scan & Resolve Low and Medium Priority Issues
    if: >
      github.actor != 'google-labs-jules[bot]' &&
      github.actor != 'google-labs-jules' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Invoke Jules Issue Resolver
        uses: google-labs-code/jules-action@v1.0.0
        with:
          api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Scan the repository for open medium and low priority issues.

            Tasks:
            1. Query all open issues labeled with medium or low priority (e.g. `priority: medium`, `priority: low`, `medium`, `low`, `priority-medium`, `priority-low`).
            2. Review each issue's contents, requirements, and current repository status.
            3. For each issue, verify whether the problem is addressed, obsolete, or can be safely resolved.
            4. Post a detailed summary comment on the issue explaining the review finding.
            5. Automatically close off resolved, redundant, or completed low/medium priority issues.

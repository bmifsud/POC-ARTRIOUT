name: Jules Qodo Defect Fixer

on:
  pull_request:
    types: [opened, synchronize, labeled]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix-qodo-defects:
    name: Fix Qodo Code Review Defects
    if: >
      github.actor != 'google-labs-jules[bot]' &&
      github.actor != 'google-labs-jules' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'qodo-fix') || contains(github.event.pull_request.labels.*.name, 'qodo:fix') || contains(github.event.pull_request.labels.*.name, 'qodo-review') || github.event.label.name == 'qodo-fix' || github.event.label.name == 'qodo:fix' || github.event.label.name == 'qodo-review')) ||
        (github.event_name == 'pull_request_review' && (contains(github.event.review.body, 'Qodo') || contains(github.event.review.body, 'qodo'))) ||
        (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, 'Qodo') || contains(github.event.comment.body, 'qodo'))) ||
        (github.event_name == 'issue_comment' && (contains(github.event.comment.body, 'Qodo') || contains(github.event.comment.body, 'qodo') || contains(github.event.comment.body, 'qodo:fix'))) ||
        (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'qodo-fix') || contains(github.event.issue.labels.*.name, 'qodo:fix') || github.event.label.name == 'qodo-fix' || github.event.label.name == 'qodo:fix'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Invoke Jules Qodo Defect Fixer
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            A Qodo code review output has identified defects that require automated remediation.

            Context & Source Details:
            - Item: #${{ github.event.pull_request.number || github.event.issue.number }} ("${{ github.event.pull_request.title || github.event.issue.title }}")
            - Qodo Review Output:
            ${{ github.event.comment.body || github.event.review.body || github.event.pull_request.body || github.event.issue.body }}

            Execution Directives:
            1. Parse the Qodo code review output and compile an ordered list of identified defects.
            2. Process each defect resolution strictly one at a time before proceeding to the next defect:
               a. Inspect the codebase for the root cause of the current defect.
               b. Implement targeted code changes and unit tests to fix the specific defect.
               c. Verify locally that the fix for the current defect resolves the issue without regressions.
               d. Move on to the next defect only after the current defect has been fully resolved and verified.
            3. Adhere strictly to repository privacy, security, and architectural tenets defined in AR trion:
               - BIPA Consent Hard Gates (`ClickwrapConsent.ts`)
               - Ephemeral Zero-Retention Memory Sanitization (`MemorySanitizer.ts`)
               - Zero-Egress Network Policies (`NetworkEgressGuard.ts`)
               - Sub-16 ms WebGPU rendering frame budget
            4. Before submitting, execute the full local CI validation sequence (`npm ci`, `npm run lint`, `npm run test:unit`, `npm run test:audit`) to confirm zero regressions.
            5. Submit a pull request or commit updates documenting each defect fix in sequential order.
